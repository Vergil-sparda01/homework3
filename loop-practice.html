<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Loop Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .container {
            max-width: 450px;
            padding: 20px;
            border: 1px solid gray;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: green;
        }
        #output {
            margin-top: 15px;
            padding: 15px;
            background-color: white;
            border: 1px solid white;
            border-radius: 8px;
            font-family: monospace;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ทดสอบการทำงานของ Loop</h2>

        <label for="maxNumInput">กรุณากรอกตัวเลขสูงสุด (maxNumber):</label>
        <input type="number" id="maxNumInput" min="0" value="20" placeholder="เช่น 15 หรือ 20">
        
        <button onclick="runLoop()">ประมวลผล Loop</button>

        <div id="output">กรอกตัวเลขแล้วกดปุ่มเพื่อดูผลลัพธ์</div>
    </div>

    <script>
        function runLoop() {
            let inputVal = document.getElementById("maxNumInput").value;

            if (inputVal === "") {
                alert("กรุณากรอกตัวเลขก่อนครับ!");
                return;
            }

            let maxNumber = Number(inputVal);

            if (maxNumber < 0) {
                alert("กรุณากรอกตัวเลขตั้งแต่ 0 ขึ้นไปครับ!");
                return;
            }

            let outputDiv = document.getElementById("output");
            let htmlText = "";

            console.clear();
            console.log("=== 1. เช็กเลขคู่ / เลขคี่ (0 ถึง " + maxNumber + ") ===");
            htmlText += "<h3>1. เช็กเลขคู่ / เลขคี่ (0 ถึง " + maxNumber + ")</h3>";

            for (let i = 0; i <= maxNumber; i++) {
                let result = "";
                if (i % 2 === 0) {
                    result = `${i} (คู่)`;
                } else {
                    result = `${i} (คี่)`;
                }

                console.log(result);
                htmlText += result + "<br>";
            }

            console.log("\n=== 2. นับทีละ 2 ===");
            htmlText += "<h3>2. นับทีละ 2</h3>";

            for (let i = 0; i <= maxNumber; i += 2) {
                console.log(i);
                htmlText += i + " ";
            }
            htmlText += "<br>";

            console.log("\n=== 3. นับถอยหลังจาก 10 ถึง 0 ===");
            htmlText += "<h3>3. นับถอยหลังจาก 10 ถึง 0</h3>";

            for (let i = 10; i >= 0; i--) {
                console.log(i);
                htmlText += i + " ";
            }

            outputDiv.innerHTML = htmlText;
        }
        runLoop();
    </script>

</body>
</html>
