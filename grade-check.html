<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Grade Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .container {
            max-width: 350px;
            padding: 20px;
            border: 1px solid Light Gray;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: Blue;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: Dark Blue;
        }
        #output {
            margin-top: 15px;
            padding: 15px;
            background-color: black;
            color: white;
            border-radius: 8px;
            font-family: monospace;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ระบบตรวจสอบเกรด</h2>
        
        <label for="scoreInput">กรุณากรอกคะแนน (0-100):</label>
        <input type="number" id="scoreInput" min="0" max="100" placeholder="ระบุคะแนนที่นี่...">
        
        <button onclick="checkGrade()">คำนวณเกรด</button>

        <div id="output">กรอกคะแนนแล้วกดปุ่มคำนวณ</div>
    </div>

    <script>
        function checkGrade() {
            let scoreInput = document.getElementById("scoreInput").value;

            if (scoreInput === "") {
                alert("กรุณากรอกคะแนน");
                return;
            }

            let score = Number(scoreInput);

            if (score < 0 || score > 100) {
                alert("กรุณากรอกคะแนนให้อยู่ในช่วง0-100");
                return;
            }

            let grade = "";
            let status = "";

            if (score >= 80) {
                grade = "A";
            } else if (score >= 70) {
                grade = "B";
            } else if (score >= 60) {
                grade = "C";
            } else if (score >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            if (score >= 50) {
                status = "ผ่าน";
            } else {
                status = "ไม่ผ่าน";
            }

            let resultConsole = `คะแนนที่ระบุ: ${score}\nเกรด: ${grade}\nผลสอบ: ${status}`;
            let resultHTML = `คะแนนที่ระบุ: ${score}<br>เกรด: ${grade}<br>ผลสอบ: ${status}`;

            console.log(resultConsole);

            document.getElementById("output").innerHTML = resultHTML;
        }
    </script>

</body>
</html>
